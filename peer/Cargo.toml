[package]
name = "wasm-canvas-peer"
version = "0.1.0"
edition = "2021"

[dependencies]
wasm-canvas = { path = "..", default-features = false }
nrepl = { path = "../nrepl" }
env_logger = "0.11"
log = "0.4"
dirs = "6"
tiny_http = "0.12"
tikv-jemallocator = { version = "0.6", features = ["profiling", "stats"] }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats", "profiling", "use_std"] }
