[package]
name = "wasm-canvas-relay"
version = "0.1.0"
edition = "2021"

[dependencies]
libp2p = { version = "0.54", features = ["noise", "yamux", "tcp", "tokio", "macros", "relay", "identify", "rendezvous"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
