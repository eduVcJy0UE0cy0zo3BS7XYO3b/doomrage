[workspace]
members = [".", "relay", "peer", "net", "nrepl"]

[package]
name = "wasm-canvas"
version = "0.1.0"
edition = "2021"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_plot", "dep:wgpu", "dep:rfd", "dep:notify", "dep:notify-debouncer-mini"]

[[bin]]
name = "wasm-canvas"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
# GUI-only (optional)
egui = { version = "0.33.3", optional = true }
eframe = { version = "0.33.3", default-features = false, features = ["wgpu", "default_fonts"], optional = true }
wgpu = { version = "27.0.1", features = ["vulkan", "gles"], optional = true }
rfd = { version = "0.17.2", optional = true }
egui_plot = { version = "0.34.1", optional = true }
notify = { version = "8.2.0", optional = true }
notify-debouncer-mini = { version = "0.7.0", optional = true }

# Core (always)
wasmtime = { version = "43.0.0", features = ["component-model"] }
wit-parser = "0.245.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
scheme-rs = { version = "0.1.0", default-features = false, features = ["load-libraries-from-fs"] }
inventory = "0.3"
surrealdb = { version = "3.0.4", default-features = false, features = ["kv-mem"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
wasm-canvas-net = { path = "net" }
nrepl = { path = "nrepl" }
rayon = "1"
rand = "0.8"
anyhow = "1.0.102"
dirs = "6"
log = "0.4.29"
env_logger = "0.11.9"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["x11", "wayland"], optional = true }
